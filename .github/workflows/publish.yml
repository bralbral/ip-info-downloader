name: Download and publish IP databases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 3 * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IP2LOCATION_TOKEN: ${{ secrets.IP2LOCATION_TOKEN }}
      OUTPUT_DIR: dist
      DOWNLOAD_DIR: downloads
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: bash start.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ip-data-$(date -u +%F)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" dist/* --title "$tag" --notes-file RELEASE_NOTES.md --latest=false
          fi
      - name: Delete releases and tags older than one month
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cutoff_time="$(date -u -d '1 month ago' +%FT%TZ)"
          cutoff_date="${cutoff_time%%T*}"

          mapfile -t old_releases < <(
            gh release list \
              --limit 1000 \
              --json tagName,createdAt \
              --jq ".[] | select(.tagName | test(\"^ip-data-[0-9]{4}-[0-9]{2}-[0-9]{2}$\")) | select(.createdAt < \"$cutoff_time\") | .tagName"
          )

          for tag in "${old_releases[@]}"; do
            echo "Deleting old release and tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done

          mapfile -t release_tags < <(
            git ls-remote --tags --refs origin 'refs/tags/ip-data-*' |
              awk '{ sub(/^refs\/tags\//, "", $2); print $2 }'
          )

          for tag in "${release_tags[@]}"; do
            if [[ "$tag" =~ ^ip-data-([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]] &&
               [[ "${BASH_REMATCH[1]}" < "$cutoff_date" ]]; then
              echo "Deleting old orphaned tag: $tag"
              git push origin --delete "$tag"
            fi
          done
